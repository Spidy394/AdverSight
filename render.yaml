services:
  # ---------------------------------------------
  # Backend  — FastAPI / Python 3.14
  # ---------------------------------------------
  - type: web
    name: adversight-api
    runtime: python
    rootDir: server
    plan: free

    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: GEMINI_API_KEY
        sync: false

      - key: PYTHON_VERSION
        value: "3.14.0"

  # ---------------------------------------------
  # Frontend — React / Vite (Static Site)
  # ---------------------------------------------
  - type: web
    name: adversight-client
    runtime: static
    rootDir: client
    plan: free

    buildCommand: npm install && npm run build
    staticPublishPath: dist

    headers:
      - path: /*
        name: Cache-Control
        value: no-cache

    routes:
      - type: rewrite
        source: /*
        destination: /index.html
