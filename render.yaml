services:
  # ---------------------------------------------
  # Backend — FastAPI / Python 3.14
  # Frontend is hosted on Vercel: https://client-zeta-nine-99.vercel.app
  # ---------------------------------------------
  - type: web
    name: adversight-api
    runtime: python
    rootDir: server
    plan: free

    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: GEMINI_API_KEY
        sync: false          # set manually in Render dashboard

      - key: CORS_ORIGINS
        value: "https://client-zeta-nine-99.vercel.app"

      - key: PYTHON_VERSION
        value: "3.14.0"
