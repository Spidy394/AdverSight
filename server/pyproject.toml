[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Spidy394", email = "mondalshubhodeep30924@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = true

[tool.uv.build-backend]
# The package lives at ./app, not ./src/app, so the module root is the project
# root. With "src" the build fails with "Expected a Python module at src/app".
module-name = "app"
module-root = "."

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
